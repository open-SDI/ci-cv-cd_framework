schema_version: sdi.stage-profile/v1
profile_version: sdi.composition-stage-profile/v1
stage: composition
work_limit_seconds: 600
inputs:
  - slot: run_request
    path: run-request.yaml
    media_type: application/yaml
    schema_version: sdi.pipeline-integration-run-request/v1
  - slot: requirements_specification
    path: requirements-specification.yaml
    media_type: application/yaml
    schema_version: sdi.mobility-requirements-specification/v1
  - slot: target_profile
    path: target-profile.yaml
    media_type: application/yaml
    schema_version: sdi.target-execution-profile/v1
outputs:
  - slot: composition_blueprint
    path: outputs/composition-blueprint.json
    media_type: application/json
    schema_version: sdi.composition-blueprint/v1
    required: true
    max_bytes: 32768
  - slot: deployment_schema
    path: outputs/deployment-schema.json
    media_type: application/json
    schema_version: sdi.deployment-schema/v1
    required: true
    max_bytes: 32768
diagnostic:
  path: diagnostic.txt
  media_type: text/plain; charset=utf-8
  max_bytes: 4096
