jenkins:
  systemMessage: "SDI pipeline integration controller. Repository configuration is authoritative."
  numExecutors: 0
  mode: EXCLUSIVE
  slaveAgentPort: -1
  disableRememberMe: true
  noUsageStatistics: true
  scmCheckoutRetryCount: 0
  markupFormatter: plainText
  crumbIssuer:
    standard: {}
  securityRealm:
    local:
      allowsSignup: false
      enableCaptcha: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${jenkins-admin-password}"
        - id: "${JENKINS_HANDOFF_ID}"
          password: "${jenkins-handoff-password}"
  authorizationStrategy:
    projectMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_ID}"
            permissions:
              - "Overall/Administer"
        - user:
            name: "${JENKINS_HANDOFF_ID}"
            permissions:
              - "Overall/Read"
  globalNodeProperties:
    - envVars:
        env:
          - key: "SDI_REPOSITORY_URL"
            value: "${JENKINS_REPOSITORY_URL}"
          - key: "JENKINS_PIPELINE_RUN_LIMIT_SECONDS"
            value: "${JENKINS_PIPELINE_RUN_LIMIT_SECONDS}"
          - key: "JENKINS_COMPOSITION_WORK_LIMIT_SECONDS"
            value: "${JENKINS_COMPOSITION_WORK_LIMIT_SECONDS}"
          - key: "JENKINS_IMAGE_BUILD_WORK_LIMIT_SECONDS"
            value: "${JENKINS_IMAGE_BUILD_WORK_LIMIT_SECONDS}"
          - key: "JENKINS_CV_WORK_LIMIT_SECONDS"
            value: "${JENKINS_CV_WORK_LIMIT_SECONDS}"
          - key: "JENKINS_CD_WORK_LIMIT_SECONDS"
            value: "${JENKINS_CD_WORK_LIMIT_SECONDS}"
  nodes:
    - permanent:
        name: "integration"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "integration"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: true
              internalDir: "remoting"
              workDirPath: "/home/jenkins/agent"
        retentionStrategy: "always"
    - permanent:
        name: "ci"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "composition"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: true
              internalDir: "remoting"
              workDirPath: "/home/jenkins/agent"
        retentionStrategy: "always"
    - permanent:
        name: "image-build"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "image-build"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: true
              internalDir: "remoting"
              workDirPath: "/home/jenkins/agent"
        retentionStrategy: "always"
    - permanent:
        name: "cv"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "cv"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: true
              internalDir: "remoting"
              workDirPath: "/home/jenkins/agent"
        retentionStrategy: "always"
    - permanent:
        name: "cd"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "cd"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: true
              internalDir: "remoting"
              workDirPath: "/home/jenkins/agent"
        retentionStrategy: "always"

unclassified:
  buildDiscarders:
    configuredBuildDiscarders:
      - jobBuildDiscarder
      - simpleBuildDiscarder:
          discarder:
            logRotator:
              daysToKeepStr: "90"
              artifactDaysToKeepStr: "90"

jobs:
  - providedEnv:
      HANDOFF_USER: "${JENKINS_HANDOFF_ID}"
      REPOSITORY_URL: "${JENKINS_REPOSITORY_URL}"
  - file: /usr/local/share/jenkins/job-dsl/pipeline-integration.groovy

security:
  apiToken:
    creationOfLegacyTokenEnabled: false
    tokenGenerationOnCreationEnabled: false
  scriptApproval:
    approvedSignatures:
      - "method org.jenkinsci.plugins.workflow.steps.FlowInterruptedException getCauses"
